# ----------------------------------------
# CodeQL Security Scan
# ----------------------------------------
# Builds a CodeQL database per language and reports findings to GitHub code
# scanning (Security tab). Both the Rust crate (under rust/) and the Python
# package are scanned. Rust is supported only with build-mode: none (no
# autobuild/manual); Python needs no build either — so CodeQL extracts each
# database directly from source and the rust/ crate location needs no special
# handling.
# ----------------------------------------

name: CodeQL Security Scan

on:
  # Manual trigger
  workflow_dispatch:

  # Run on PRs targeting main
  pull_request:
    branches: [ main ]

  # Run on pushes to main
  push:
    branches: [ main ]

  # Weekly scheduled scan (Monday 03:00 UTC)
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write  # upload SARIF results to GitHub code scanning
      actions: read           # read metadata about the actions used
      contents: read          # check out the repository

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust is only supported with build-mode: none (no autobuild/manual).
          - language: rust
            build-mode: none
          # Python needs no build either; none extracts directly from source.
          - language: python
            build-mode: none
          # C/C++ is the one language here that MUST be compiled: the extractor
          # observes a real build rather than reading source. `autobuild` is not
          # used because it would guess at the build, and this tree has a
          # specific one -- the Makefile that `sources.txt` drives (ADR-0002).
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Only c-cpp reaches this step; the other two use build-mode: none and
      # extract straight from source (Rust does not support autobuild).
      #
      # `all` compiles every translation unit -- library, CLI and the Catch2
      # suite -- without running the tests. That is exactly what the extractor
      # needs: it observes compilation, not execution. Running the suite is
      # cpp-ci.yml's job, on more tiers than this one would cover.
      - name: Build C++ for the CodeQL extractor
        if: matrix.language == 'c-cpp'
        run: make -C cpp -j"$(nproc)" all

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
