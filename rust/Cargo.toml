[package]
name = "mie-decoder"
version = "2.12.0"
edition = "2024"
rust-version = "1.88"
description = "Decoder for DDC MIL-STD-1553 MIE binary recording files"
license = "Apache-2.0"
authors = ["Joey"]
readme = "README.md"

# cargo-semver-checks lint policy. `DecoderConfig` and `ConfigOverrides`
# (src/config.rs) are internal config plumbing — nothing outside the crate
# constructs them, and the stable public API is the `lib.rs` re-exports. They are
# `#[doc(hidden)]` so their growing field set is excluded from the SemVer
# contract; this `allow` accepts the one-time doc-hidden transition in v2.5.0
# (the gate still guards the real public API). See L1-MRG-003 / L2-MRG-007.
[package.metadata.cargo-semver-checks.lints]
struct_now_doc_hidden = "allow"

[lib]
name = "mie_decoder"
path = "src/lib.rs"

[[bin]]
name = "mie-decoder"
path = "src/bin/mie-decoder.rs"

[dependencies]
memmap2 = "0.9"

# Lint policy lives here so plain `cargo build` / `cargo clippy` enforce it, not
# just the CI flags. All three pass clean today; they formalize practices the
# crate already follows (the CI `clippy -- -D warnings` gate still applies on
# top of these).
[lints.rust]
# Require an explicit `unsafe {}` block for unsafe operations inside an
# `unsafe fn` (warn-by-default in edition 2024; denied here).
unsafe_op_in_unsafe_fn = "deny"
# Flag `pub` items that aren't reachable from the crate root — they should be
# `pub(crate)`. Keeps the public API surface intentional.
unreachable_pub = "deny"

[lints.clippy]
# Every `unsafe {}` block must carry a `// SAFETY:` comment. Promotes the
# repo's existing SAFETY-comment convention (also grep-checked by the
# pre-commit hook) from a heuristic to a real lint.
undocumented_unsafe_blocks = "deny"
# ALLOW-BY-DEFAULT IN CLIPPY, AND THEREFORE INVISIBLE TO THE GATE.
# `cargo clippy -- -D warnings` only denies lints that actually FIRE, and
# clippy's pedantic / nursery / restriction groups are allow-by-default. Sonar's
# Rust rules map onto clippy's including those tiers, so SonarCloud reported
# findings the local gate had reported none of -- which reads as clippy
# disagreeing with itself and is really two different lint sets.
#
# Enabled by name rather than by group: `pedantic` and `nursery` together
# produce 413 warnings in this crate, most of them doc formatting.
#
# clippy::redundant_closure_for_method_calls == sonar rust:S1612. Exact 1:1, and
# the crate is clean under it.
redundant_closure_for_method_calls = "deny"

# `_name` conventionally means UNUSED, so using such an item contradicts its own
# name. The crate had one: `log::_emit`, public purely so the exported `log_*!`
# macros could resolve it at a call site in another crate. `#[doc(hidden)]` is
# the marker for that; the underscore was the wrong tool for the job.
used_underscore_items = "deny"

# THE CAST LINTS. Pedantic, so `-D warnings` never saw them either -- and unlike
# most of pedantic these are semantic: every one asks whether a narrowing or
# sign-changing conversion can actually lose information here.
#
# The crate was clean of real defects, but the safety lived in prose. Each site
# had a guard immediately above it and a comment explaining why the cast was
# fine, which is a guarantee the compiler cannot check and a later edit can
# separate from its guard. Most are now `try_from`, so the range check and the
# conversion are one expression; the handful that remain are `#[allow]` with a
# `reason` naming the invariant.
#
# One real improvement fell out: `StandardTimestamp::to_microseconds` returns an
# Option and used `as`, which SATURATES -- an absurd tick rate produced
# u64::MAX and it read downstream as a real timestamp. It now answers None.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_lossless = "deny"

# NOT ENABLED: clippy::cognitive_complexity (== sonar rust:S3776).
#
# Aligning the threshold looked obvious and does not work. Sonar reported one
# S3776 -- `FilterConfig::should_exclude`, scoring 17 against its limit of 15.
# Setting clippy's threshold to the same 15 flags that function AND two more
# that Sonar does not report at all (`cli::parse_decode` at 23,
# `DecoderConfig::with_overrides` at 18). The two tools compute the metric
# differently, so a matching number buys a stricter local rule, not a predictive
# one -- and `parse_decode` scores high because it is a flat dispatch chain over
# two dozen flags, which is a lookup table written as control flow rather than
# something a reader struggles with.
#
# Left off deliberately: enabling it would mean either contorting a
# well-tested parser or blanket-allowing it, and neither makes SonarCloud any
# more predictable from here.

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
